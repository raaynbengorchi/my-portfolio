<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- shield -->
  <g filter="url(#glow)">
    <path d="M512,150 L620,200 L620,330 Q620,420 512,470 Q404,420 404,330 L404,200 Z" fill="#0a1420" stroke="#00e5ff" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- lock -->
    <rect x="482" y="292" width="60" height="46" rx="8" fill="none" stroke="#a855f7" stroke-width="4"/>
    <path d="M486,292 L486,268 a26,26 0 0 1 52,0 L538,292" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="512" cy="320" r="6" fill="#a855f7"/>
  </g>
  <!-- code lines left -->
  <g filter="url(#glow)">
    <g stroke="#00e5ff" stroke-width="2.5" opacity="0.55" stroke-linecap="round">
      <line x1="200" y1="230" x2="340" y2="230"/><line x1="230" y1="262" x2="370" y2="262"/>
      <line x1="180" y1="294" x2="320" y2="294"/>
    </g>
    <g stroke="#a855f7" stroke-width="2.5" opacity="0.55" stroke-linecap="round">
      <line x1="200" y1="360" x2="350" y2="360"/><line x1="180" y1="392" x2="330" y2="392"/>
      <line x1="230" y1="424" x2="370" y2="424"/>
    </g>
  </g>
  <!-- scan beam -->
  <g filter="url(#glow)">
    <rect x="150" y="444" width="300" height="6" rx="3" fill="#a855f7" opacity="0.8"/>
    <line x1="150" y1="447" x2="450" y2="447" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- ok checkmarks -->
  <g filter="url(#glow)">
    <circle cx="392" cy="230" r="16" fill="#0a1420" stroke="#00e5ff" stroke-width="2"/>
    <path d="M385,230 L390,236 L400,224" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="392" cy="360" r="16" fill="#0a1420" stroke="#a855f7" stroke-width="2"/>
    <path d="M385,360 L390,366 L400,354" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">SECURITY AUDIT :: OPTIMIZATION :: CODE REFACTOR</text>
</svg>
