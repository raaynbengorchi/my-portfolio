<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- mic / audio waveform -->
  <g filter="url(#glow)">
    <rect x="360" y="140" width="34" height="120" rx="17" fill="#0a1420" stroke="#00e5ff" stroke-width="3.5"/>
    <path d="M377,270 a60,90 0 0 0 0,120" fill="none" stroke="#00e5ff" stroke-width="4"/>
    <rect x="277" y="280" width="200" height="10" rx="5" fill="#0a1420" stroke="#a855f7" stroke-width="1.5"/>
  </g>
  <!-- waveform bars -->
  <g stroke="#00e5ff" stroke-width="6" opacity="0.7" stroke-linecap="round">
    <line x1="220" y1="330" x2="220" y2="390"/><line x1="255" y1="310" x2="255" y2="410"/><line x1="290" y1="290" x2="290" y2="430"/>
    <line x1="325" y1="320" x2="325" y2="400"/><line x1="360" y1="300" x2="360" y2="420"/>
  </g>
  <!-- document with summary -->
  <g filter="url(#glow)">
    <rect x="540" y="180" width="260" height="300" rx="12" fill="#0a1420" stroke="#a855f7" stroke-width="3"/>
    <text x="570" y="225" font-family="monospace" font-size="15" fill="#a855f7">SUMMARY</text>
    <line x1="570" y1="255" x2="740" y2="255" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="570" y1="285" x2="700" y2="285" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="570" y1="315" x2="730" y2="315" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <text x="570" y="370" font-family="monospace" font-size="13" fill="#00e5ff">ACTION ITEMS</text>
    <g fill="#00e5ff">
      <rect x="570" y="388" width="12" height="12" rx="3"/><rect x="570" y="420" width="12" height="12" rx="3"/><rect x="570" y="452" width="12" height="12" rx="3"/>
    </g>
  </g>
  <!-- transform beam -->
  <g filter="url(#glow)">
    <path d="M420,440 Q 470,470 520,430" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="6 8"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#a855f7" opacity="0.85" filter="url(#soft)">TRANSCRIBE :: SUMMARIZE :: TASK EXTRACT</text>
</svg>
