<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- left vault -->
  <g filter="url(#glow)">
    <g transform="translate(180,180)">
      <rect x="0" y="10" width="150" height="130" rx="14" fill="#0a1e24" stroke="#00e5ff" stroke-width="3.5"/>
      <rect x="18" y="0" width="114" height="26" rx="6" fill="#00e5ff" opacity="0.9"/>
      <rect x="60" y="66" width="30" height="30" fill="none" stroke="#00e5ff" stroke-width="3"/>
      <circle cx="75" cy="81" r="6" fill="#00e5ff"/>
      <line x1="42" y1="118" x2="108" y2="118" stroke="#00e5ff" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
  <!-- right vault -->
  <g filter="url(#glow)">
    <g transform="translate(694,180) scale(1,1)">
      <rect x="0" y="10" width="150" height="130" rx="14" fill="#0a1e24" stroke="#00e5ff" stroke-width="3.5"/>
      <rect x="18" y="0" width="114" height="26" rx="6" fill="#00e5ff" opacity="0.9"/>
      <rect x="60" y="66" width="30" height="30" fill="none" stroke="#00e5ff" stroke-width="3"/>
      <circle cx="75" cy="81" r="6" fill="#00e5ff"/>
      <line x1="42" y1="118" x2="108" y2="118" stroke="#00e5ff" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
  <!-- central ETH symbol -->
  <g filter="url(#glow)">
    <g stroke="#a855f7" stroke-width="3" fill="none" stroke-linejoin="round">
      <path d="M427,190 L512,150 L597,190 L512,520 Z" fill="#0a1420" stroke="#a855f7" stroke-width="3.5"/>
      <path d="M427,190 L512,345 L597,190 Z" opacity="0.7"/>
      <path d="M512,355 L512,520" opacity="0.7"/>
    </g>
    <circle cx="512" cy="345" r="70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.4"/>
  </g>
  <!-- blockchain link vaults -->
  <g filter="url(#glow)">
    <path d="M330,330 Q 427,430 512,410" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.6" stroke-dasharray="6 8"/>
    <path d="M694,200 Q 512,430 512,410" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.6" stroke-dasharray="6 8"/>
    <line x1="370" y1="330" x2="654" y2="330" stroke="#a855f7" stroke-width="2.5" opacity="0.5" stroke-dasharray="4 9"/>
    <!-- link nodes -->
    <circle cx="330" cy="330" r="8" fill="#00e5ff"/><circle cx="694" cy="200" r="8" fill="#00e5ff"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">ESCROW :: MILESTONE :: SMART CONTRACT</text>
</svg>


