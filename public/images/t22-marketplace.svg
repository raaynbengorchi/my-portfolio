    <text x="215" y="362" font-family="monospace" font-size="12" fill="#00e5ff">VENDOR A</text>
    <line x1="215" y1="400" x2="350" y2="400" stroke="#00e5ff" stroke-width="2.5" opacity="0.4"/>
    <line x1="215" y1="430" x2="330" y2="430" stroke="#00e5ff" stroke-width="2.5" opacity="0.4"/>
    <rect x="422" y="340" width="180" height="150" rx="10" fill="#0a1420" stroke="#a855f7" stroke-width="2"/>
    <rect x="422" y="340" width="180" height="34" rx="10" fill="#0c1230" stroke="none"/>
    <text x="437" y="362" font-family="monospace" font-size="12" fill="#a855f7">VENDOR B</text>
    <line x1="437" y1="400" x2="572" y2="400" stroke="#a855f7" stroke-width="2.5" opacity="0.4"/>
    <line x1="437" y1="430" x2="552" y2="430" stroke="#a855f7" stroke-width="2.5" opacity="0.4"/>
    <rect x="644" y="340" width="180" height="150" rx="10" fill="#0a1420" stroke="#00e5ff" stroke-width="2"/>
    <rect x="644" y="340" width="180" height="34" rx="10" fill="#0c1230" stroke="none"/>
    <text x="659" y="362" font-family="monospace" font-size="12" fill="#00e5ff">VENDOR C</text>
    <line x1="659" y1="400" x2="794" y2="400" stroke="#00e5ff" stroke-width="2.5" opacity="0.4"/>
    <line x1="659" y1="430" x2="774" y2="430" stroke="#00e5ff" stroke-width="2.5" opacity="0.4"/>
  </g>
  <!-- split payment -->
  <g filter="url(#glow)">
    <path d="M420,520 L420,470 M412,520 L420,505 L428,520 Z" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M604,520 L604,470 M596,520 L604,505 L612,520 Z" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#a855f7" opacity="0.85" filter="url(#soft)">MULTI-VENDOR :: SPLIT PAYMENTS :: SCALE</text>
