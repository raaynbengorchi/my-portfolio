<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- chat bubble -->
  <g filter="url(#glow)">
    <rect x="250" y="150" width="524" height="300" rx="36" fill="#0a1420" stroke="#00e5ff" stroke-width="4"/>
    <path d="M330,450 L380,450 L410,520 L440,450 L460,450" fill="#0a1420" stroke="#00e5ff" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- bot avatar -->
  <g filter="url(#glow)">
    <rect x="380" y="200" width="120" height="96" rx="28" fill="url(#neon)" opacity="0.9"/>
    <circle cx="418" cy="248" r="11" fill="#0a1420"/><circle cx="462" cy="248" r="11" fill="#0a1420"/>
    <line x1="408" y1="272" x2="472" y2="272" stroke="#0a1420" stroke-width="7" stroke-linecap="round"/>
    <rect x="400" y="175" width="80" height="18" rx="6" fill="#00e5ff"/>
  </g>
  <!-- slash command -->
  <g filter="url(#glow)">
    <rect x="320" y="330" width="130" height="36" rx="18" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="385" y="354" text-anchor="middle" font-family="monospace" font-size="15" fill="#00e5ff">/moderate</text>
    <rect x="470" y="330" width="130" height="36" rx="18" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <text x="535" y="354" text-anchor="middle" font-family="monospace" font-size="15" fill="#a855f7">/playlist</text>
    <rect x="620" y="330" width="130" height="36" rx="18" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="685" y="354" text-anchor="middle" font-family="monospace" font-size="15" fill="#00e5ff">/stats</text>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">DISCORD BOT :: DASHBOARD :: MODERATION</text>
</svg>
