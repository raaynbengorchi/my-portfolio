    <line x1="675" y1="295" x2="770" y2="295" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="675" y1="325" x2="800" y2="325" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
