<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- stacked coins -->
  <g filter="url(#glow)">
    <ellipse cx="512" cy="470" rx="170" ry="26" fill="#0a1420" stroke="#a855f7" stroke-width="2.5"/>
    <ellipse cx="512" cy="400" rx="150" ry="26" fill="#0a1420" stroke="#00e5ff" stroke-width="2.5"/>
    <ellipse cx="512" cy="330" rx="128" ry="26" fill="#0a1420" stroke="#a855f7" stroke-width="2.5"/>
    <ellipse cx="512" cy="260" rx="104" ry="26" fill="#0a1420" stroke="#00e5ff" stroke-width="2.5"/>
    <path d="M512,255 a104,26 0 0 1 104,0 L104,0" opacity="0"/>
    <!-- up arrow -->
    <path d="M512,140 L512,90 M512,90 L498,104 M512,90 L526,104" fill="none" stroke="#ffd76a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- APY badge -->
  <g filter="url(#glow)">
    <rect x="660" y="200" width="120" height="48" rx="24" fill="#0c1230" stroke="#ffd76a" stroke-width="1.5"/>
    <text x="720" y="230" text-anchor="middle" font-family="monospace" font-size="16" fill="#ffd76a">APY 18.7%</text>
  </g>
  <!-- harvest -->
  <g filter="url(#glow)">
    <circle cx="300" cy="280" r="40" fill="#0a1420" stroke="#a855f7" stroke-width="3"/>
    <text x="300" y="292" text-anchor="middle" font-family="monospace" font-size="18" fill="#a855f7">HK</text>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">STAKING :: YIELD :: DEFI</text>
