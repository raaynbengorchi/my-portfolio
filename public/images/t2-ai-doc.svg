<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- neural network brain (right) -->
  <g filter="url(#glow)">
    <g stroke="#a855f7" stroke-width="2" opacity="0.6">
      <line x1="560" y1="200" x2="640" y2="150"/><line x1="640" y1="150" x2="720" y2="200"/><line x1="560" y1="200" x2="640" y2="330"/>
      <line x1="720" y1="200" x2="640" y2="330"/><line x1="560" y1="200" x2="720" y2="200"/><line x1="640" y1="150" x2="560" y2="330"/>
      <line x1="720" y1="200" x2="640" y2="330"/><line x1="560" y1="330" x2="720" y2="330"/><line x1="640" y1="330" x2="640" y2="430"/>
      <line x1="560" y1="330" x2="640" y2="430"/><line x1="720" y1="330" x2="640" y2="430"/>
    </g>
    <g fill="#00e5ff">
      <circle cx="560" cy="200" r="9"/><circle cx="640" cy="150" r="9"/><circle cx="720" cy="200" r="9"/>
      <circle cx="560" cy="330" r="9"/><circle cx="720" cy="330" r="9"/><circle cx="640" cy="330" r="10" fill="#a855f7"/>
    </g>
    <circle cx="640" cy="430" r="12" fill="#a855f7"/>
  </g>
  <!-- brain halo -->
  <ellipse cx="640" cy="265" rx="130" ry="120" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 8" filter="url(#soft)"/>
  <!-- open book (left), neon border -->
  <g filter="url(#glow)">
    <path d="M220,220 L300,175 L380,220 L380,430 L300,385 L220,430 Z" fill="#0a1a24" stroke="#00e5ff" stroke-width="3.5"/>
    <path d="M300,175 L300,385" stroke="#00e5ff" stroke-width="3"/>
    <path d="M220,220 L220,430 L300,385 Z" fill="#0a2a34" stroke="none"/>
    <path d="M380,220 L380,430 L300,385" fill="none" stroke="#00e5ff" stroke-width="3"/>
    <!-- scan lines across page -->
    <g stroke="#00e5ff" stroke-width="2" opacity="0.6">
      <line x1="240" y1="255" x2="360" y2="255"/><line x1="240" y1="300" x2="320" y2="300"/><line x1="240" y1="340" x2="345" y2="340"/>
    </g>
  </g>
  <!-- data beam book -> network -->
  <g filter="url(#glow)">
    <path d="M380,300 Q470,250 560,220" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-dasharray="6 8" opacity="0.9"/>
    <circle cx="470" cy="252" r="7" fill="#00e5ff"/>
  </g>
  <text x="40" y="600" font-family="monospace" font-size="14" fill="#a855f7" opacity="0.85" filter="url(#soft)">RAG :: DOCUMENT CHATBOT :: LLM</text>
</svg>
