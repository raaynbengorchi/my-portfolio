<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- calendar -->
  <g filter="url(#glow)">
    <rect x="250" y="160" width="380" height="340" rx="16" fill="#0a1420" stroke="#00e5ff" stroke-width="3.5"/>
    <rect x="250" y="160" width="380" height="60" rx="16" fill="#0c1230" stroke="none"/>
    <line x1="290" y1="140" x2="290" y2="180" stroke="#00e5ff" stroke-width="3"/>
    <line x1="590" y1="140" x2="590" y2="180" stroke="#00e5ff" stroke-width="3"/>
    <!-- schedule rows -->
    <g stroke="#00e5ff" stroke-width="2" opacity="0.4">
      <line x1="280" y1="260" x2="520" y2="260"/><line x1="280" y1="320" x2="480" y2="320"/><line x1="280" y1="380" x2="540" y2="380"/><line x1="280" y1="440" x2="500" y2="440"/>
    </g>
    <g fill="#00e5ff"><rect x="540" y="248" width="60" height="24" rx="6" opacity="0.8"/><rect x="500" y="308" width="80" height="24" rx="6" fill="#a855f7" opacity="0.8"/></g>
  </g>
  <!-- publish icons -->
  <g filter="url(#glow)">
    <rect x="700" y="200" width="100" height="40" rx="10" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="750" y="225" text-anchor="middle" font-family="monospace" font-size="13" fill="#00e5ff">TIKTOK</text>
    <rect x="700" y="270" width="100" height="40" rx="10" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <text x="750" y="295" text-anchor="middle" font-family="monospace" font-size="13" fill="#a855f7">YT</text>
    <rect x="700" y="340" width="100" height="40" rx="10" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="750" y="365" text-anchor="middle" font-family="monospace" font-size="13" fill="#00e5ff">IG</text>
  </g>
  <!-- beam to calendar -->
  <g filter="url(#glow)">
    <line x1="700" y1="270" x2="630" y2="270" stroke="#a855f7" stroke-width="3" stroke-dasharray="6 8"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">SCHEDULER :: MULTI-PLATFORM :: AUTOPOST</text>
</svg>
