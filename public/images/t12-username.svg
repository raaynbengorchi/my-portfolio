    <circle cx="512" cy="320" r="0"/>
    <text x="512" y="220" text-anchor="middle" font-family="monospace" font-size="64" fill="#00e5ff">@</text>
    <text x="512" y="480" text-anchor="middle" font-family="monospace" font-size="34" fill="#a855f7">SNIPED</text>
  </g>
  <!-- sparkles -->
  <g fill="#00e5ff" filter="url(#glow)">
    <path d="M300,180 l8,18 l18,8 l-18,8 l-8,18 l-8,-18 l-18,-8 l18,-8 Z" opacity="0.7"/>
    <path d="M724,440 l6,14 l14,6 l-14,6 l-6,14 l-6,-14 l-14,-6 l14,-6 Z" opacity="0.7"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">USERNAME SNIPER :: MONITOR :: AUTO-CLAIM</text>
