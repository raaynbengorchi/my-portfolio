<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- phone -->
  <g filter="url(#glow)">
    <rect x="332" y="80" width="360" height="470" rx="42" fill="#070a18" stroke="#00e5ff" stroke-width="3.5"/>
    <rect x="332" y="80" width="360" height="470" rx="42" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>
    <rect x="492" y="98" width="40" height="7" rx="3.5" fill="#00e5ff" opacity="0.6"/>
    <!-- top stat bar -->
    <rect x="356" y="124" width="312" height="60" rx="12" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <text x="374" y="152" font-family="monospace" font-size="15" fill="#00e5ff">ASSETS</text>
    <text x="640" y="152" text-anchor="end" font-family="monospace" font-size="15" fill="#a855f7">+24.6%</text>
    <!-- task list -->
    <rect x="356" y="200" width="312" height="150" rx="12" fill="#0c1230" stroke="#2a3a6a" stroke-width="1"/>
    <g stroke="#00e5ff" stroke-width="3">
      <line x1="376" y1="230" x2="400" y2="230"/><line x1="376" y1="262" x2="400" y2="262"/><line x1="376" y1="294" x2="400" y2="294"/>
    </g>
    <g stroke="#a855f7" stroke-width="2" opacity="0.5">
      <line x1="414" y1="230" x2="600" y2="230"/><line x1="414" y1="262" x2="570" y2="262"/><line x1="414" y1="294" x2="590" y2="294"/>
    </g>
    <!-- asset chart -->
    <rect x="356" y="366" width="312" height="150" rx="12" fill="#0c1230" stroke="#2a3a6a" stroke-width="1"/>
    <polyline points="376,480 420,460 466,472 512,430 556,444 600,404 648,414"
      fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="648" cy="414" r="5" fill="#a855f7"/>
  </g>
  <!-- floating check marks -->
  <g filter="url(#glow)">
    <circle cx="250" cy="160" r="24" fill="#0a1420" stroke="#00e5ff" stroke-width="2"/>
    <path d="M241,160 L248,167 L260,152" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="774" cy="520" r="24" fill="#0a1420" stroke="#00e5ff" stroke-width="2"/>
    <path d="M765,520 L772,527 L784,512" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">TASKS :: ASSETS :: PRODUCTIVITY</text>
</svg>
