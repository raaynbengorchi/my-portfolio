<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- shopping bag -->
  <g filter="url(#glow)">
    <path d="M372,180 L352,300 L672,300 L652,180 Z" fill="#0a1420" stroke="#00e5ff" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M452,180 L452,260" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
    <path d="M572,180 L572,260" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
    <path d="M432,240 a40,40 0 0 1 80,0" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- AI recommendation star -->
  <g filter="url(#glow)">
    <circle cx="740" cy="200" r="46" fill="#0a1420" stroke="#a855f7" stroke-width="3"/>
    <path d="M740,178 l10,20 l22,3 l-16,16 l4,22 l-20,-11 l-20,11 l4,-22 l-16,-16 l22,-3 Z" fill="#a855f7"/>
  </g>
  <!-- product cards -->
  <g filter="url(#glow)">
    <rect x="180" y="360" width="150" height="120" rx="10" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="210" y="382" width="90" height="50" rx="6" fill="url(#neon)" opacity="0.35"/>
    <line x1="200" y1="452" x2="280" y2="452" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
    <rect x="438" y="360" width="150" height="120" rx="10" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="468" y="382" width="90" height="50" rx="6" fill="url(#neon)" opacity="0.35"/>
    <line x1="458" y1="452" x2="538" y2="452" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
    <rect x="696" y="360" width="150" height="120" rx="10" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="726" y="382" width="90" height="50" rx="6" fill="url(#neon)" opacity="0.35"/>
    <line x1="716" y1="452" x2="796" y2="452" stroke="#00e5ff" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- beam bag -> star -->
  <path d="M672,240 Q 706,215 740,205" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="5 7" opacity="0.8"/>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">E-COMMERCE :: AI RECOMMENDATIONS :: STRIPE</text>
</svg>
