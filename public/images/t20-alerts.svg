<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- bell -->
  <g filter="url(#glow)">
    <path d="M462,360 a50,50 0 0 1 100,0 Z" fill="#0a1420" stroke="#ffd76a" stroke-width="3"/>
    <path d="M445,360 L579,360" stroke="#ffd76a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="512" cy="422" r="10" fill="none" stroke="#ffd76a" stroke-width="3"/>
    <circle cx="512" cy="180" r="14" fill="#ffd76a"/>
    <!-- sound waves -->
    <g stroke="#00e5ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M400,240 a70,70 0 0 1 0,90"/><path d="M380,225 a95,95 0 0 1 0,120"/><path d="M624,240 a70,70 0 0 0 0,90"/><path d="M644,225 a95,95 0 0 0 0,120"/>
    </g>
  </g>
  <!-- rising price line -->
  <g filter="url(#glow)">
    <polyline points="220,460 300,420 380,440 460,380 540,400 620,330 700,350 780,270"
      fill="none" stroke="url(#neon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- channels -->
  <g filter="url(#glow)">
    <rect x="690" y="420" width="120" height="36" rx="18" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/><text x="750" y="443" text-anchor="middle" font-family="monospace" font-size="12" fill="#00e5ff">TG</text>
    <rect x="690" y="470" width="120" height="36" rx="18" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/><text x="750" y="493" text-anchor="middle" font-family="monospace" font-size="12" fill="#a855f7">DISCORD</text>
    <rect x="690" y="520" width="120" height="36" rx="18" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/><text x="750" y="543" text-anchor="middle" font-family="monospace" font-size="12" fill="#00e5ff">MAIL</text>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#ffd76a" opacity="0.85" filter="url(#soft)">PRICE ALERTS :: REALTIME :: TARGETS</text>
</svg>
