<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- chat bubble -->
  <g filter="url(#glow)">
    <rect x="120" y="150" width="380" height="230" rx="24" fill="#0a1420" stroke="#00e5ff" stroke-width="3.5"/>
    <circle cx="176" cy="220" r="18" fill="url(#neon)" opacity="0.8"/>
    <circle cx="176" cy="220" r="7" fill="#0a1420"/>
    <line x1="214" y1="210" x2="440" y2="210" stroke="#00e5ff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="214" y1="238" x2="390" y2="238" stroke="#00e5ff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <circle cx="176" cy="300" r="18" fill="url(#neon)" opacity="0.8"/>
    <circle cx="176" cy="300" r="7" fill="#0a1420"/>
    <line x1="214" y1="290" x2="430" y2="290" stroke="#a855f7" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="214" y1="318" x2="370" y2="318" stroke="#a855f7" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <rect x="240" y="352" width="110" height="26" rx="13" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <text x="295" y="369" text-anchor="middle" font-family="monospace" font-size="12" fill="#a855f7">SEND</text>
  </g>
  <!-- whiteboard -->
  <g filter="url(#glow)">
    <rect x="560" y="150" width="360" height="280" rx="14" fill="#0c1424" stroke="#a855f7" stroke-width="3.5"/>
    <!-- sticky notes -->
    <rect x="595" y="180" width="90" height="70" rx="6" fill="url(#neon)" opacity="0.35" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="705" y="180" width="90" height="70" rx="6" fill="url(#neon)" opacity="0.35" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="815" y="180" width="70" height="70" rx="6" fill="url(#neon)" opacity="0.35" stroke="#00e5ff" stroke-width="1.5"/>
    <!-- drawing strokes -->
    <path d="M595,300 C650,270 700,330 755,285 C800,250 840,295 880,270" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="755" cy="285" r="7" fill="#a855f7"/>
    <!-- users cursors -->
    <path d="M700,210 l0,22 l6,-6 l8,10" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="700" cy="210" r="6" fill="#00e5ff"/>
    <path d="M840,250 l0,22 l6,-6 l8,10" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="840" cy="250" r="6" fill="#a855f7"/>
  </g>
  <!-- connection beam -->
  <g filter="url(#glow)">
    <line x1="500" y1="265" x2="560" y2="265" stroke="#00e5ff" stroke-width="3" stroke-dasharray="5 7"/>
    <circle cx="530" cy="265" r="6" fill="#a855f7"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">REALTIME :: CHAT :: COLLABORATION</text>
</svg>
