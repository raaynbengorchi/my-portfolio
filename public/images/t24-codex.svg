<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- code window -->
  <g filter="url(#glow)">
    <rect x="200" y="150" width="380" height="340" rx="14" fill="#070a18" stroke="#00e5ff" stroke-width="3"/>
    <rect x="200" y="150" width="380" height="40" rx="14" fill="#0c1230" stroke="none"/>
    <circle cx="228" cy="170" r="7" fill="#a855f7"/><circle cx="250" cy="170" r="7" fill="#00e5ff"/><circle cx="272" cy="170" r="7" fill="#ffd76a"/>
    <g font-family="monospace" font-size="16">
      <text x="225" y="225" fill="#a855f7">function</text><text x="300" y="225" fill="#00e5ff"> parse(data)</text>
      <text x="225" y="260" fill="#00e5ff">  return</text><text x="300" y="260" fill="#a855f7"> data.trim()</text>
      <text x="225" y="295" fill="#00e5ff">  .replace(</text><text x="300" y="295" fill="#a855f7">/\\s+/g</text><text x="440" y="295" fill="#00e5ff">, ' ')</text>
      <text x="225" y="330" fill="#00e5ff">  .split(' ')</text>
      <text x="225" y="365" fill="#00e5ff">  .filter(Boolean)</text>
      <text x="225" y="400" fill="#a855f7">}</text>
    </g>
  </g>
  <!-- explainer panel -->
  <g filter="url(#glow)">
    <rect x="620" y="180" width="210" height="280" rx="12" fill="#0a1420" stroke="#a855f7" stroke-width="3"/>
    <text x="645" y="220" font-family="monospace" font-size="14" fill="#a855f7">EXPLAINED</text>
    <line x1="645" y1="250" x2="780" y2="250" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="645" y1="280" x2="740" y2="280" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="645" y1="310" x2="770" y2="310" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="645" y1="340" x2="720" y2="340" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="645" y1="370" x2="760" y2="370" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="645" y1="400" x2="730" y2="400" stroke="#00e5ff" stroke-width="2.5" opacity="0.5"/>
  </g>
  <!-- sparkle -->
  <g filter="url(#glow)">
    <path d="M512,540 l10,24 l24,10 l-24,10 l-10,24 l-10,-24 l-24,-10 l24,-10 Z" fill="#ffd76a"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#a855f7" opacity="0.85" filter="url(#soft)">CODE HIGHLIGHT :: EXPLAIN :: CLEAN</text>
</svg>
