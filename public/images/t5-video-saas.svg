<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/>
  </g>
  <!-- editor frame -->
  <g filter="url(#glow)">
    <rect x="120" y="120" width="784" height="400" rx="18" fill="#070a18" stroke="#00e5ff" stroke-width="3"/>
    <rect x="120" y="120" width="784" height="46" rx="18" fill="#0c1230" stroke="none"/>
    <text x="140" y="150" font-family="monospace" font-size="14" fill="#00e5ff">TIMELINE</text>
    <text x="884" y="150" text-anchor="end" font-family="monospace" font-size="14" fill="#a855f7">AI MARKERS</text>
    <!-- clips row -->
    <g>
      <rect x="150" y="200" width="160" height="70" rx="8" fill="url(#neon)" opacity="0.3" stroke="#00e5ff" stroke-width="2"/>
      <rect x="330" y="200" width="120" height="70" rx="8" fill="url(#neon)" opacity="0.3" stroke="#a855f7" stroke-width="2"/>
      <rect x="470" y="200" width="200" height="70" rx="8" fill="url(#neon)" opacity="0.3" stroke="#00e5ff" stroke-width="2"/>
      <rect x="690" y="200" width="180" height="70" rx="8" fill="url(#neon)" opacity="0.3" stroke="#a855f7" stroke-width="2"/>
    </g>
    <!-- AI marker flags -->
    <g>
      <path d="M330,190 L330,172 L342,182 L330,192 Z" fill="#00e5ff"/>
      <circle cx="330" cy="190" r="4" fill="#00e5ff"/>
      <path d="M690,190 L690,172 L702,182 L690,192 Z" fill="#a855f7"/>
      <circle cx="690" cy="190" r="4" fill="#a855f7"/>
      <path d="M470,270 L470,7 L484,20 L470,33 Z" fill="#00e5ff" opacity="0.8"/>
    </g>
    <!-- audio waveform -->
    <g stroke="#00e5ff" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <line x1="150" y1="330" x2="150" y2="300"/><line x1="180" y1="330" x2="180" y2="280"/><line x1="210" y1="330" x2="210" y2="305"/>
      <line x1="240" y1="330" x2="240" y2="270"/><line x1="270" y1="330" x2="270" y2="300"/><line x1="300" y1="330" x2="300" y2="285"/>
      <line x1="330" y1="330" x2="330" y2="265"/><line x1="360" y1="330" x2="360" y2="300"/><line x1="390" y1="330" x2="390" y2="280"/>
      <line x1="420" y1="330" x2="420" y2="305"/><line x1="450" y1="330" x2="450" y2="275"/><line x1="480" y1="330" x2="480" y2="300"/>
    </g>
    <!-- playhead -->
    <line x1="560" y1="190" x2="560" y2="330" stroke="#ffd76a" stroke-width="3"/>
    <circle cx="560" cy="190" r="7" fill="#ffd76a"/>
    <!-- time ruler -->
    <g stroke="#2a3a6a" stroke-width="2">
      <line x1="150" y1="360" x2="150" y2="375"/><line x1="250" y1="360" x2="250" y2="375"/><line x1="350" y1="360" x2="350" y2="375"/>
      <line x1="450" y1="360" x2="450" y2="375"/><line x1="550" y1="360" x2="550" y2="375"/><line x1="650" y1="360" x2="650" y2="375"/>
      <line x1="750" y1="360" x2="750" y2="375"/><line x1="850" y1="360" x2="850" y2="375"/>
    </g>
  </g>
  <!-- upload/process arrow -->
  <g filter="url(#glow)">
    <circle cx="512" cy="470" r="30" fill="#0a1420" stroke="#00e5ff" stroke-width="3"/>
    <path d="M512,455 L512,487 M512,455 L499,468 M512,455 L525,468" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#a855f7" opacity="0.85" filter="url(#soft)">CLIPPING :: AUTO SCHEDULE :: ANALYTICS</text>
</svg>
