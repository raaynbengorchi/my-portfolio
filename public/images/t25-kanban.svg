<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="1024" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#141433"/><stop offset="55%" stop-color="#0b0b1a"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1024" height="640" fill="url(#bg)"/>
  <g stroke="#101030" stroke-width="1" opacity="0.6"><line x1="0" y1="160" x2="1024" y2="160"/><line x1="0" y1="320" x2="1024" y2="320"/><line x1="0" y1="480" x2="1024" y2="480"/></g>
  <!-- board header -->
  <g filter="url(#glow)">
    <rect x="120" y="120" width="784" height="380" rx="16" fill="#070a18" stroke="#00e5ff" stroke-width="3"/>
    <rect x="120" y="120" width="784" height="46" rx="16" fill="#0c1230" stroke="none"/>
    <text x="145" y="149" font-family="monospace" font-size="14" fill="#00e5ff">KANBAN :: PROJECT BOARD</text>
  </g>
  <!-- columns -->
  <g filter="url(#glow)">
    <rect x="150" y="190" width="230" height="280" rx="10" fill="#0a1420" stroke="#2a3a6a" stroke-width="1.5"/>
    <text x="170" y="220" font-family="monospace" font-size="13" fill="#00e5ff">TO DO</text>
    <rect x="170" y="240" width="190" height="54" rx="8" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="170" y="308" width="190" height="54" rx="8" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="400" y="190" width="230" height="280" rx="10" fill="#0a1420" stroke="#2a3a6a" stroke-width="1.5"/>
    <text x="420" y="220" font-family="monospace" font-size="13" fill="#a855f7">IN PROGRESS</text>
    <rect x="420" y="240" width="190" height="54" rx="8" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="420" y="308" width="190" height="54" rx="8" fill="#0c1230" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="650" y="190" width="230" height="280" rx="10" fill="#0a1420" stroke="#2a3a6a" stroke-width="1.5"/>
    <text x="670" y="220" font-family="monospace" font-size="13" fill="#00e5ff">DONE</text>
    <rect x="670" y="240" width="190" height="54" rx="8" fill="#0c1230" stroke="#00e5ff" stroke-width="1.5"/>
    <path d="M702,262 L712,272 L734,248" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- drag cursor -->
  <g filter="url(#glow)">
    <path d="M560,330 l0,26 l8,-8 l10,12" fill="none" stroke="#ffd76a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="560" cy="330" r="6" fill="#ffd76a"/>
  </g>
  <!-- sync beam -->
  <g filter="url(#glow)">
    <path d="M880,120 a40,40 0 0 1 0,60" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="5 8"/>
  </g>
  <text x="40" y="620" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.85" filter="url(#soft)">KANBAN :: DRAG &amp; DROP :: REALTIME SYNC</text>
